<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cqxet.site – Projelerim</title>
<style>
  :root{--bg:#0e1015;--card:#171a22;--line:#262b38;--txt:#e8eaf0;--mut:#8b92a5;--acc:#6ea8fe}
  @media(prefers-color-scheme:light){:root{--bg:#f5f6fa;--card:#fff;--line:#e2e5ee;--txt:#1b1e27;--mut:#657089;--acc:#2f6fed}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,Segoe UI,sans-serif}
  header{max-width:1100px;margin:0 auto;padding:56px 16px 24px}
  h1{margin:0 0 6px;font-size:2rem}
  header p{margin:0;color:var(--mut)}
  .tools{max-width:1100px;margin:0 auto;padding:0 16px 16px;display:flex;gap:10px;flex-wrap:wrap}
  input{flex:1;min-width:200px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:inherit}
  .tag{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--mut);cursor:pointer;font:inherit}
  .tag.on{color:var(--acc);border-color:var(--acc)}
  main{max-width:1100px;margin:0 auto;padding:0 16px 64px;display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
  a.card:hover{transform:translateY(-3px);border-color:var(--acc)}
  .thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--acc),#8e5cf7);display:grid;place-items:center;font-size:2.4rem;color:#fff;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .body{padding:14px 16px 16px}
  .body h2{margin:0 0 4px;font-size:1.1rem}
  .body p{margin:0 0 10px;color:var(--mut);font-size:.92rem}
  .chip{font-size:.75rem;color:var(--acc)}
  .empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:40px}
  footer{text-align:center;color:var(--mut);padding:0 16px 32px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Projelerim</h1>
  <p>cqxet.site altında yaptığım tüm projeler</p>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="Proje ara…">
  <span id="tags"></span>
</div>
<main id="grid"></main>
<footer>© cqxet.site</footer>

<script src="config.js"></script>
<script>
let projects=[];
const safeUrl=u=>/^(https?:\/\/|\/|\.\/|[\w-]+\/)/i.test(u||'')?u:'#';
async function load(){
  const c=window.SITE||{};
  try{
    if(c.owner&&!c.owner.startsWith('GITHUB_')){
      const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/${c.file}?ref=${c.branch}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});
      if(r.ok) return await r.json();
    }
  }catch(e){}
  return await (await fetch('projects.json',{cache:'no-store'})).json();
}
const grid=document.getElementById('grid'), q=document.getElementById('q'), tagsEl=document.getElementById('tags');
let active='';
let tags=[];
function renderTags(){
  tagsEl.innerHTML='';
  ['Tümü',...tags].forEach(t=>{
    const b=document.createElement('button');
    b.className='tag'+((t==='Tümü'&&!active)||t===active?' on':'');
    b.textContent=t;
    b.onclick=()=>{active=t==='Tümü'?'':t;renderTags();render()};
    tagsEl.appendChild(b);
  });
}
function render(){
  const s=q.value.toLowerCase();
  const list=projects.filter(p=>(!active||p.tag===active)&&(p.title+p.desc).toLowerCase().includes(s));
  grid.innerHTML=list.length?'':'<div class="empty">Sonuç yok.</div>';
  list.forEach(p=>{
    const a=document.createElement('a');a.className='card';a.href=safeUrl(p.url);
    const th=document.createElement('div');th.className='thumb';
    if(p.img){const i=document.createElement('img');i.src=p.img;i.alt=p.title;th.appendChild(i)}else th.textContent=p.emoji||'📁';
    const b=document.createElement('div');b.className='body';
    const h=document.createElement('h2');h.textContent=p.title;
    const d=document.createElement('p');d.textContent=p.desc;
    const c=document.createElement('span');c.className='chip';c.textContent=p.tag||'';
    b.append(h,d,c);a.append(th,b);grid.appendChild(a);
  });
}
q.oninput=render;
load().then(d=>{projects=d;tags=[...new Set(d.map(p=>p.tag).filter(Boolean))];renderTags();render()}).catch(()=>{grid.innerHTML='<div class="empty">Projeler yüklenemedi.</div>'});
</script>
</body>
</html>
